<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1218">
<title>臺北市常見問答查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#e9edf3; --surface:#fff; --surface-2:#f4f7fa; --surface-3:#e8eef6;
  --ink:#131c26; --ink-2:#485664; --ink-3:#7a8898;
  --line:#d6dee8; --line-2:#c3cede;
  --accent:#1f4b8f; --accent-2:#2f6ac0; --accent-soft:#e6ecf8;
  --warn:#9c5a11; --btn-on:#fff;
  --serif:"Noto Serif TC",Georgia,serif;
  --sans:"Noto Sans TC","Segoe UI","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0c1218; --surface:#141d26; --surface-2:#1a2430; --surface-3:#22303d;
  --ink:#e8eef5; --ink-2:#aab7c4; --ink-3:#7c8a99;
  --line:#28353f; --line-2:#36485a;
  --accent:#86adee; --accent-2:#a7c5f7; --accent-soft:#182842;
  --warn:#e0a75c; --btn-on:#0c1218;}}
:root[data-theme="dark"]{
  --paper:#0c1218; --surface:#141d26; --surface-2:#1a2430; --surface-3:#22303d;
  --ink:#e8eef5; --ink-2:#aab7c4; --ink-3:#7c8a99;
  --line:#28353f; --line-2:#36485a;
  --accent:#86adee; --accent-2:#a7c5f7; --accent-soft:#182842;
  --warn:#e0a75c; --btn-on:#0c1218;}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--serif);margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent);overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
  height:100vh;height:100dvh}
.bar{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px 10px;
  display:flex;flex-direction:column;gap:7px}
.brand{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3)}
h1{font-size:17px;white-space:nowrap}
.home{margin-left:auto;font-family:var(--mono);font-size:11.5px;text-decoration:none;
  border:1px solid var(--line-2);border-radius:7px;padding:3px 9px;color:var(--ink-2)}
.home:hover{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:7px}
#q{flex:1 1 auto;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;
  padding:11px 12px;font-size:16px}
#q:focus{border-color:var(--accent)}
#org{flex:none;max-width:44%;background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:10px;padding:11px 8px;font-size:13px}
.stat{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.list{overflow-y:auto;padding:8px 12px calc(20px + var(--safe-b))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;
  overflow:hidden}
.card > button{display:block;width:100%;text-align:left;background:none;border:none;padding:11px 13px;
  cursor:pointer}
.card > button:hover{background:var(--surface-2)}
.card .q{font-size:15px;line-height:1.55;font-weight:500;overflow-wrap:anywhere}
.card .m{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:3px;
  overflow-wrap:anywhere}
.card .m b{color:var(--accent);font-weight:600}
.ans{display:none;padding:0 13px 13px;border-top:1px solid var(--line);margin-top:2px}
.card.open .ans{display:block}
.ans p{margin:9px 0 0;font-size:14.5px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.ans .src{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:10px}
mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px}
.empty,.loading{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line-2);
  border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;
  margin-right:7px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (min-width:820px){
  .app{max-width:860px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand">
      <span class="eyebrow">臺北市政府</span>
      <h1>常見問答查詢</h1>
      
    </div>
    <div class="row">
      <input id="q" type="search" placeholder="輸入關鍵字，例如 拖吊、特休、房屋稅" inputmode="search"
             autocomplete="off">
      <select id="org"><option value="">全部局處</option></select>
    </div>
    <div class="stat" id="stat"><span class="spin"></span>載入題庫…</div>
  </div>
  <div class="list" id="list">
    <div class="loading"><span class="spin"></span>正在載入 8,317 題題庫索引（約 2 MB，第一次載入後會被瀏覽器快取）</div>
  </div>
</div>
<script>
(function(){
"use strict";
var IDX=null, META=null, SHARDS={}, LIMIT=60, cur=[];
var q=document.getElementById('q'), orgSel=document.getElementById('org'),
    list=document.getElementById('list'), stat=document.getElementById('stat');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(n){return Number(n||0).toLocaleString('en-US')}
function hl(t,k){
  t=esc(t);
  if(!k)return t;
  var i=t.indexOf(k);
  return i<0?t:t.slice(0,i)+'<mark>'+esc(k)+'</mark>'+t.slice(i+k.length);
}
fetch('data/faq-index.json').then(function(r){
  if(!r.ok)throw new Error(r.status);return r.json();
}).then(function(d){
  META=d;IDX=d.items;
  var h='<option value="">全部局處（'+num(d.n)+' 題）</option>';
  for(var i=0;i<d.orgs.length;i++)
    h+='<option value="'+esc(d.orgs[i][0])+'">'+esc(d.orgs[i][0])+'（'+d.orgs[i][1]+'）</option>';
  orgSel.innerHTML=h;
  render();
},function(){
  list.innerHTML='<div class="empty">題庫載入失敗，請重新整理頁面。</div>';
  stat.textContent='載入失敗';
});
function match(){
  var k=q.value.trim(), o=orgSel.value, out=[];
  for(var i=0;i<IDX.length;i++){
    var it=IDX[i];
    if(o&&it[1]!==o)continue;
    if(k&&it[0].indexOf(k)<0)continue;
    out.push(it);
  }
  return out;
}
function render(){
  if(!IDX)return;
  cur=match();
  var k=q.value.trim(),h='',n=Math.min(cur.length,LIMIT);
  for(var i=0;i<n;i++){
    var it=cur[i];
    h+='<div class="card" data-i="'+i+'"><button type="button">'+
       '<span class="q">'+hl(it[0],k)+'</span>'+
       '<span class="m"><b>'+esc(it[1])+'</b> · '+esc(it[2])+' · 發布 '+esc(it[3]||'—')+
       ' · 點閱 '+num(it[4])+(it[5]?' · ID '+esc(it[5]):'')+'</span></button>'+
       '<div class="ans" id="a'+i+'"></div></div>';
  }
  list.innerHTML=h||'<div class="empty">找不到符合的題目，換個關鍵字試試。</div>';
  list.scrollTop=0;
  stat.innerHTML='符合 <b style="color:var(--ink)">'+num(cur.length)+'</b> 題'+
    (cur.length>LIMIT?'（顯示前 '+LIMIT+' 筆，請再縮小關鍵字）':'')+
    ' · 題庫 '+num(META.n)+' 題 · '+esc(META.generated)+' 匯出';
}
function openCard(card,i){
  var it=cur[i],box=document.getElementById('a'+i);
  card.classList.toggle('open');
  if(!card.classList.contains('open')||box.dataset.done)return;
  box.innerHTML='<p><span class="spin"></span>讀取答覆…</p>';
  var sh=it[7],pos=it[8];
  function paint(arr){
    box.innerHTML='<p>'+esc(arr[pos].a)+'</p>'+
      '<div class="src">來源：'+esc(it[2])+(it[3]?' · 發布 '+esc(it[3]):'')+
      (it[5]?' · ID '+esc(it[5]):'')+
      (it[6]?'<br><a href="'+esc(it[6])+'" target="_blank" rel="noopener">開啟市府原始問答頁 ↗</a>':'')+
      '</div>';
    box.dataset.done='1';
  }
  if(SHARDS[sh])return paint(SHARDS[sh]);
  fetch('data/faq-a-'+(sh<10?'0':'')+sh+'.json').then(function(r){return r.json()})
    .then(function(arr){SHARDS[sh]=arr;paint(arr)},
          function(){box.innerHTML='<p>答覆載入失敗，請點原始問答頁查看。</p>'});
}
list.addEventListener('click',function(e){
  var b=e.target.closest('.card > button');
  if(!b)return;
  var card=b.parentNode;
  openCard(card,Number(card.getAttribute('data-i')));
});
var t=null;
q.addEventListener('input',function(){clearTimeout(t);t=setTimeout(render,140)});
orgSel.addEventListener('change',render);
})();
</script>
</body>
</html>
